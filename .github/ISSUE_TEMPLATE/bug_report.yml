name: Bug report
description: Something broken in Vinemap (CLI, MCP, indexing, retrieval)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Vinemap runs locally — please include versions and OS so we can reproduce.
  - type: input
    id: version
    attributes:
      label: Vinemap version
      placeholder: "vinemap --version output, e.g. 0.1.2"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. vinemap index .
        2. vinemap query "..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / stderr (optional)
      render: shell
