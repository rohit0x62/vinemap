name: Publish PyPI

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish to confirm"
        required: true

jobs:
  publish:
    if: github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Publish to PyPI (trusted publisher)
        id: trusted
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true

      - name: Publish to PyPI (API token fallback)
        if: steps.trusted.outcome == 'failure' && secrets.PYPI_API_TOKEN != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*
