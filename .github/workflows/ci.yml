name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install engine (dev + treesitter)
        run: pip install -e ".[dev,treesitter]"

      - name: Run pytest
        run: pytest tests -q -m "not slow"

      - name: Run precision@k golden eval (all fixtures)
        run: python eval/run_eval.py --all

      - name: Verify benchmark export
        run: python eval/export_results.py --out /tmp/eval-data.json

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine check
        run: twine check dist/*

  stress:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install engine
        run: pip install -e ".[dev]"

      - name: 1k-file stress benchmark
        run: python bench/stress_index.py --files 1000 --lazy
